name: Portfolio quality checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run verify
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://jacobroutzong.dev' }}
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-static-build
          path: dist/
