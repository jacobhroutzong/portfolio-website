name: Refresh public repository activity
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: write
concurrency:
  group: refresh-public-activity
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Fetch current public repository metadata
        run: npm run sync:activity
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet -- src/data/activity.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate repository grouping
        if: steps.changes.outputs.changed == 'true'
        run: node --test tests/repositories.test.mjs
      - name: Build and check site links
        if: steps.changes.outputs.changed == 'true'
        run: npm run build
      - name: Commit changed snapshot
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/activity.json
          git commit -m 'Refresh public repository activity'
          git push origin HEAD:main
