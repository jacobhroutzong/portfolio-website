name: Portfolio quality checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy
      - run: npm run verify
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://jacobroutzong.dev' }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-static-build
          path: dist/
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ascent .
      - run: docker run -d --name ascent -p 7860:7860 ascent
      - run: curl --retry 10 --retry-all-errors --retry-delay 2 --fail --silent --show-error --output /dev/null http://127.0.0.1:7860/ascent/
      - if: failure()
        run: docker logs ascent
      - if: always()
        run: docker rm -f ascent
