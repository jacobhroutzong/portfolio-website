name: Refresh challenge snapshot
on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *'
permissions:
  contents: write
concurrency:
  group: refresh-challenges
  cancel-in-progress: false
jobs:
  refresh:
    if: vars.CHALLENGE_INDEX_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run sync:challenges
        env:
          CHALLENGE_INDEX_URL: ${{ vars.CHALLENGE_INDEX_URL }}
      - run: npm run verify
      - name: Commit validated snapshot
        run: |
          if ! git diff --quiet -- src/data/challenges.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/data/challenges.json
            git commit -m 'Update validated challenge snapshot'
            git push origin HEAD:main
          fi
